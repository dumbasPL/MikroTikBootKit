name: Test

# Whole-chain test in both image modes (CHR and x86), by default on the latest
# RouterOS release, plus the arm64 CHR.
#
# The version is resolved first: the version input if one was given, otherwise
# the newest release on the channel asked for (the ROUTEROS_CHANNEL repository
# variable, default "stable") straight from upgrade.mikrotik.com - the same
# NEWESTa7.<channel> endpoint the routers use.  Each x86 matrix job then:
#   1. builds the kit (ptrace_init, the loader and bootkit.img),
#   2. installs a clean RouterOS image from the stock installer ISO with
#      ./vmtest.sh iso-install (EFI mode, so the layout matches the images the
#      harness was developed against),
#   3. installs the bootkit on a copy with ./vmtest.sh test (direct) and
#      ./vmtest.sh test-removable (removable), boots the target and checks the
#      loader + tracer + LD_PRELOAD probe lines on the serial console,
#   4. boots the same target through the both-arch auto stick
#      (./vmtest.sh test-auto: \BOOTKIT.CFG = target=auto - the first RouterOS
#      kernel found is booted, nothing is installed),
#   5. logs in with admin/admin and checks the licence the probe installed
#      (p-unlimited on CHR, no demo countdown on x86).
# The arm64 job uses the stock chr-<ver>-arm64.img.zip instead of the ISO
# (there is no arm64 installer ISO): ./vmtest.sh unpacks it, installs the kit
# and checks the same lines and the p-unlimited licence; the CHR arm64
# userspace is AArch32, so the probe and the tracer are built as arm32.
#
# GitHub-hosted runners have no usable KVM, so the QEMU accelerator is probed
# and falls back to emulation (TCG); a self-hosted runner with /dev/kvm uses
# KVM and runs much faster.  The arm64 job always emulates (TCG + cortex-a72:
# the CHR arm64 kernel hangs with -cpu max).  daily.yml calls this workflow
# once a day.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: RouterOS version to test (empty = the latest on the channel)
        required: false
        default: ""
        type: string
      channel:
        description: Release channel to resolve the latest version from
        required: true
        default: stable
        type: choice
        options:
          - long-term
          - stable
          - testing
          - development
  workflow_call:
    inputs:
      version:
        description: RouterOS version to test (empty = the latest on the channel)
        required: false
        default: ""
        type: string
      channel:
        description: Release channel to resolve the latest version from
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve the RouterOS version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel || vars.ROUTEROS_CHANNEL || 'stable' }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            long-term|stable|testing|development) ;;
            *) echo "::error::unknown RouterOS release channel '$CHANNEL'"; exit 1 ;;
          esac
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            echo "checking the latest RouterOS version on the $CHANNEL channel"
            body=$(curl -fsS --retry 3 --max-time 60 \
              "https://upgrade.mikrotik.com/routeros/NEWESTa7.$CHANNEL")
            version=$(printf '%s\n' "$body" | awk 'NR == 1 { print $1 }')
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([a-z]+[0-9]+)?$ ]]; then
            echo "::error::invalid RouterOS version '$version'"
            exit 1
          fi
          echo "testing RouterOS $version (channel $CHANNEL)"
          {
            echo "### RouterOS $version"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| channel | $CHANNEL |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  vmtest:
    name: ${{ matrix.mode }} (RouterOS ${{ needs.version.outputs.version }})
    needs: version
    runs-on: ubuntu-latest
    # emulated (TCG) runs are slow; an ISO install + two boot tests fit easily
    timeout-minutes: 180
    # one run per mode and ref; a newer push cancels the older run
    concurrency:
      group: test-${{ github.ref }}-${{ matrix.mode }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        mode: [chr, x86]
    env:
      ROUTEROS_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib libc6-dev-i386 clang lld \
            gcc-arm-linux-gnueabihf \
            qemu-system-x86 ovmf mtools genisoimage cpio

      - name: Cache the i386 musl toolchain
        uses: actions/cache@v4
        with:
          path: |
            .toolchain/cache
            .toolchain/i386-musl
          key: musl-i386-${{ runner.os }}-${{ hashFiles('tools/musl_i386.sh') }}

      # bootkit-auto.img carries both loaders, so the x86 jobs build the ARM
      # side of it too (same cache key as the arm64 job)
      - name: Cache the arm musl toolchain
        uses: actions/cache@v4
        with:
          path: |
            .toolchain/cache
            .toolchain/arm-musl
          key: musl-arm-${{ runner.os }}-${{ hashFiles('tools/musl_arm.sh') }}

      # The MikroTik CDN is slow from the runners and the ISO never changes.
      - name: Cache the installer ISO
        uses: actions/cache@v4
        with:
          path: .work/mikrotik-${{ env.ROUTEROS_VERSION }}.iso
          key: routeros-iso-${{ runner.os }}-${{ env.ROUTEROS_VERSION }}

      - name: Download the installer ISO
        run: |
          set -euo pipefail
          iso=".work/mikrotik-$ROUTEROS_VERSION.iso"
          if [ ! -f "$iso" ]; then
            mkdir -p .work
            url="https://download.mikrotik.com/routeros/$ROUTEROS_VERSION/mikrotik-$ROUTEROS_VERSION.iso"
            echo "downloading $url"
            curl -fL --retry 3 -o "$iso.part" "$url"
            mv "$iso.part" "$iso"
          fi
          ls -l "$iso"
          sha256sum "$iso" >> "$GITHUB_STEP_SUMMARY"

      - name: Pick the QEMU accelerator
        run: |
          set -uo pipefail
          accel=tcg
          if [ -w /dev/kvm ]; then
            rc=0
            timeout 10 qemu-system-x86_64 -accel kvm -cpu host -m 16 \
              -display none -serial none -monitor none -S </dev/null \
              >/dev/null 2>&1 || rc=$?
            # 124 means qemu was still running when the timeout fired: KVM works
            if [ "$rc" = 124 ]; then accel=kvm; fi
          fi
          echo "ACCEL=$accel" >> "$GITHUB_ENV"
          echo "using ACCEL=$accel"

      - name: Install a clean image and test the direct install
        env:
          MODE: ${{ matrix.mode }}
          IMG_SRC: ${{ github.workspace }}/.work/mikrotik-${{ env.ROUTEROS_VERSION }}.iso
          WAIT: "900"
        run: |
          set -euo pipefail
          ./vmtest.sh test
          grep -aq 'efiboot:' .work/serial.log
          grep -aq 'ptrace-init' .work/serial.log
          grep -aq 'ldpreload. loaded by' .work/serial.log
          [ "$(grep -ac 'ldpreload. loaded by' .work/serial.log)" -ge 5 ]
          grep -aq 'mode: licence' .work/serial.log
          grep -aqE 'BdsDxe: (loading|starting) Boot.*MikroTikBootKit' .work/serial.log

      - name: Check the licence and stop the direct VM
        run: |
          set -euo pipefail
          ./vmtest.sh cmd "/system license print" | tee license-direct.txt
          ./vmtest.sh stop
          grep -aqE '(system|software)-id' license-direct.txt
          case "${{ matrix.mode }}" in
            chr) grep -aq 'level: p-unlimited' license-direct.txt ;;
            x86) ! grep -aq 'expires-in' license-direct.txt ;;
          esac

      - name: Test the removable install
        env:
          MODE: ${{ matrix.mode }}
          IMG_SRC: ${{ github.workspace }}/.work/mikrotik-${{ env.ROUTEROS_VERSION }}.iso
          WAIT: "900"
        run: |
          set -euo pipefail
          ./vmtest.sh test-removable
          grep -aq 'ptrace-init' .work/serial.log
          grep -aq 'ldpreload. loaded by' .work/serial.log
          [ "$(grep -ac 'ldpreload. loaded by' .work/serial.log)" -ge 5 ]
          grep -aq 'mode: licence' .work/serial.log
          ./vmtest.sh cmd "/system license print" | tee license-removable.txt
          ./vmtest.sh stop
          grep -aqE '(system|software)-id' license-removable.txt
          case "${{ matrix.mode }}" in
            chr) grep -aq 'level: p-unlimited' license-removable.txt ;;
            x86) ! grep -aq 'expires-in' license-removable.txt ;;
          esac

      - name: Test the auto stick
        env:
          MODE: ${{ matrix.mode }}
          IMG_SRC: ${{ github.workspace }}/.work/mikrotik-${{ env.ROUTEROS_VERSION }}.iso
          WAIT: "900"
        run: |
          set -euo pipefail
          ./vmtest.sh test-auto
          grep -aq 'efiboot: auto mode: looking for the first RouterOS kernel' .work/serial.log
          grep -aq 'efiboot: auto: kernel found on' .work/serial.log
          grep -aq 'ptrace-init' .work/serial.log
          grep -aq 'ldpreload. loaded by' .work/serial.log
          [ "$(grep -ac 'ldpreload. loaded by' .work/serial.log)" -ge 5 ]
          grep -aq 'mode: licence' .work/serial.log
          # auto mode installs nothing: the installer never runs
          ! grep -aq 'installer mode' .work/serial.log
          ./vmtest.sh cmd "/system license print" | tee license-auto.txt
          ./vmtest.sh stop
          grep -aqE '(system|software)-id' license-auto.txt
          case "${{ matrix.mode }}" in
            chr) grep -aq 'level: p-unlimited' license-auto.txt ;;
            x86) ! grep -aq 'expires-in' license-auto.txt ;;
          esac

  vmtest-arm64:
    name: arm64 (RouterOS ${{ needs.version.outputs.version }})
    needs: version
    runs-on: ubuntu-latest
    # TCG-only and slower than the x86 jobs (no KVM on hosted runners)
    timeout-minutes: 240
    concurrency:
      group: test-${{ github.ref }}-arm64
      cancel-in-progress: true
    env:
      ROUTEROS_VERSION: ${{ needs.version.outputs.version }}
      ARCH: arm64
      WAIT: "900"
      IMG_SRC: ${{ github.workspace }}/.work/chr-${{ needs.version.outputs.version }}-arm64.img.zip
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-linux-gnueabihf clang lld \
            qemu-system-arm qemu-efi-aarch64 mtools cpio unzip

      - name: Cache the arm musl toolchain
        uses: actions/cache@v4
        with:
          path: |
            .toolchain/cache
            .toolchain/arm-musl
          key: musl-arm-${{ runner.os }}-${{ hashFiles('tools/musl_arm.sh') }}

      # The CHR arm64 image is only distributed as a zip and never changes.
      - name: Cache the arm64 CHR image
        uses: actions/cache@v4
        with:
          path: .work/chr-${{ env.ROUTEROS_VERSION }}-arm64.img.zip
          key: routeros-chr-arm64-${{ runner.os }}-${{ env.ROUTEROS_VERSION }}

      - name: Download the arm64 CHR image
        run: |
          set -euo pipefail
          zip=".work/chr-$ROUTEROS_VERSION-arm64.img.zip"
          if [ ! -f "$zip" ]; then
            mkdir -p .work
            url="https://download.mikrotik.com/routeros/$ROUTEROS_VERSION/chr-$ROUTEROS_VERSION-arm64.img.zip"
            echo "downloading $url"
            curl -fL --retry 3 -o "$zip.part" "$url"
            mv "$zip.part" "$zip"
          fi
          ls -l "$zip"
          sha256sum "$zip" >> "$GITHUB_STEP_SUMMARY"

      - name: Install a clean image and test the direct install
        run: |
          set -euo pipefail
          ./vmtest.sh test
          grep -aq 'efiboot:' .work/serial.log
          grep -aq 'ptrace-init' .work/serial.log
          grep -aq 'ldpreload. loaded by' .work/serial.log
          [ "$(grep -ac 'ldpreload. loaded by' .work/serial.log)" -ge 5 ]
          grep -aq 'mode: licence' .work/serial.log
          grep -aq 'keyman: licence key patched' .work/serial.log
          grep -aqE 'BdsDxe: (loading|starting) Boot.*MikroTikBootKit' .work/serial.log

      - name: Check the licence and stop the direct VM
        run: |
          set -euo pipefail
          ./vmtest.sh cmd "/system license print" | tee license-direct.txt
          ./vmtest.sh stop
          grep -aqE 'system-id' license-direct.txt
          grep -aq 'level: p-unlimited' license-direct.txt
          ! grep -aq 'expires-in' license-direct.txt

      - name: Test the removable install
        run: |
          set -euo pipefail
          ./vmtest.sh test-removable
          grep -aq 'ptrace-init' .work/serial.log
          grep -aq 'ldpreload. loaded by' .work/serial.log
          [ "$(grep -ac 'ldpreload. loaded by' .work/serial.log)" -ge 5 ]
          grep -aq 'mode: licence' .work/serial.log
          ./vmtest.sh cmd "/system license print" | tee license-removable.txt
          ./vmtest.sh stop
          grep -aqE 'system-id' license-removable.txt
          grep -aq 'level: p-unlimited' license-removable.txt

      - name: Test the auto stick
        run: |
          set -euo pipefail
          ./vmtest.sh test-auto
          grep -aq 'efiboot: auto mode: looking for the first RouterOS kernel' .work/serial.log
          grep -aq 'efiboot: auto: kernel found on' .work/serial.log
          grep -aq 'ptrace-init' .work/serial.log
          grep -aq 'ldpreload. loaded by' .work/serial.log
          [ "$(grep -ac 'ldpreload. loaded by' .work/serial.log)" -ge 5 ]
          grep -aq 'mode: licence' .work/serial.log
          # auto mode installs nothing: the installer never runs
          ! grep -aq 'installer mode' .work/serial.log
          ./vmtest.sh cmd "/system license print" | tee license-auto.txt
          ./vmtest.sh stop
          grep -aqE 'system-id' license-auto.txt
          grep -aq 'level: p-unlimited' license-auto.txt
          ! grep -aq 'expires-in' license-auto.txt
