target=auto
# bootkit-auto.img: stay on this stick and boot the first RouterOS kernel
# found - nothing is installed and the router is not touched.  The x86 and
# the arm64 loader here share this file; "target=auto" is the magic value
# that selects the scan (bootloader/config.h, CONFIG_TARGET_AUTO).
#
# debug=0|1 (optional) adds the serial console and the verbose
# tracer/probe logs; without the line the build's default is used.
